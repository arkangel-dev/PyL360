name: Run test_package.py

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run test_package.py
        env:
          L360_USERNAME: ${{ secrets.L360_USERNAME }}
          L360_PASSWORD: ${{ secrets.L360_PASSWORD }}
        run: |
          python c:\\Users\\samra\\source\\repos\\PyL360\\test_package.py